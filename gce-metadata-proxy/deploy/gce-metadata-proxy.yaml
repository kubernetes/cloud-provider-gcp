# gce-metadata-proxy DaemonSet, for clusters whose nodes redirect Pod traffic for the metadata server
# to 169.254.169.252:988 (IPv4) or [fd20:ce::252]:988 (IPv6) at boot. See ../README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gce-metadata-proxy
  namespace: kube-system
  labels:
    k8s-app: gce-metadata-proxy
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gce-metadata-proxy
  namespace: kube-system
  labels:
    k8s-app: gce-metadata-proxy
spec:
  selector:
    matchLabels:
      k8s-app: gce-metadata-proxy
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        k8s-app: gce-metadata-proxy
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: gce-metadata-proxy
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
      - operator: Exists
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: gce-metadata-proxy
        image: registry.k8s.io/cloud-provider-gcp/gce-metadata-proxy:latest # replace with a released tag
        # The defaults listen on 169.254.169.252:988 and [fd20:ce::252]:988, skipping whichever
        # this node does not have. Uncomment to change which paths the proxy serves; see ../README.md.
        # env:
        # - name: GCE_METADATA_PROXY_PATHS
        #   value: "+instance/machine-type"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
            add: [NET_BIND_SERVICE]
        resources:
          requests:
            cpu: 30m
            memory: 25Mi
          limits:
            memory: 50Mi
      terminationGracePeriodSeconds: 30
